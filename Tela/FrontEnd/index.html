<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boneco de vodu - painel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- teia de aranha no canto -->
  <svg class="teia" viewBox="0 0 200 200" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1">
      <path d="M0 0 L200 0 M0 0 L0 200 M0 0 L190 90 M0 0 L90 190 M0 0 L160 160"/>
      <path d="M40 0 Q35 35 0 40"/>
      <path d="M80 0 Q70 70 0 80"/>
      <path d="M120 0 Q105 105 0 120"/>
      <path d="M160 0 Q140 140 0 160"/>
    </g>
  </svg>

  <header>
    <h1>Boneco de vodu</h1>
    <div class="topo-direita">
      <p id="status" class="status">Conectando...</p>
      <button id="btnSom" class="som" type="button">Ativar sons</button>
    </div>
  </header>

  <main>
    <div class="coluna">
      <section>
        <h2>Reviver</h2>
        <p class="nota">Aciona o servo e faz o humano de papelão se mexer.</p>
        <p id="estado" class="estado">Humano: vivo</p>
        <div class="linha">
          <button id="btnReviver" class="principal" data-cmd="REVIVER" disabled>Reviver</button>
          <button data-cmd="PARAR">Parar</button>
        </div>
      </section>

      <section>
        <h2>Sons</h2>
        <div class="linha">
          <button data-cmd="SFX:1">Risada</button>
          <button data-cmd="SFX:2">Sussurro</button>
          <button data-cmd="SFX:3">Grito</button>
          <button data-cmd="SFX:4">Sino</button>
          <button data-cmd="SFX:5">Trovão</button>
        </div>
      </section>
    </div>

    <div class="coluna">
      <section id="sensor">
        <h2>Sensor de distância</h2>
        <p class="leitura"><span id="cm">--</span> cm</p>
        <div class="barra"><div id="barraFill"></div></div>
        <p id="aviso" class="nota"></p>
      </section>

      <section>
        <h2>Registro</h2>
        <ul id="log"></ul>
      </section>
    </div>
  </main>

  <script src="sons.js"></script>
  <script src="script.js"></script>
</body>
</html>
